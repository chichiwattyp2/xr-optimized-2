<!DOCTYPE html>
<html lang="en">
<head>
    <title>AR Chat - Visual Communication</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            text-align: center;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 10px;
            z-index: 100;
        }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 100;
        }
        button {
            padding: 10px 20px;
            background: rgba(102, 126, 234, 0.8);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: rgba(102, 126, 234, 1);
        }
        button.active {
            background: rgba(118, 75, 162, 1);
        }
        #inputContainer {
            position: absolute;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        #messageInput {
            padding: 10px 15px;
            width: 300px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(102, 126, 234, 0.5);
            border-radius: 5px;
            outline: none;
            font-size: 14px;
        }
        #messageInput:focus {
            border-color: rgba(102, 126, 234, 1);
            background: rgba(255, 255, 255, 0.15);
        }
        #messageInput::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        #speakerSelect {
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(102, 126, 234, 0.5);
            border-radius: 5px;
            outline: none;
            cursor: pointer;
        }
        #speakerSelect option {
            background: #1a1a1a;
        }
        #sendBtn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        #sendBtn:hover {
            transform: scale(1.05);
        }
        #sendBtn:active {
            transform: scale(0.95);
        }
    </style>
    <!-- Using stable Three.js version that's known to work -->
    <script async src="https://unpkg.com/es-module-shims@1.3.6/dist/es-module-shims.js"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.155.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.155.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div id="info">
        <h2>🎭 XRBlocks AR Chat</h2>
        <p>Type a message • Enter to send • ↑↓ for history • Alt+1-5 for speaker • Ctrl+L to clear • Click in 3D space</p>
    </div>
    
    <div id="inputContainer">
        <select id="speakerSelect">
            <option value="You">👤 You</option>
            <option value="Alice">👩 Alice</option>
            <option value="Bob">👨 Bob</option>
            <option value="AI">🤖 AI Assistant</option>
            <option value="System">⚙️ System</option>
        </select>
        <input type="text" id="messageInput" placeholder="Type your message here..." maxlength="200" autofocus>
        <button id="sendBtn">Send 📤</button>
    </div>
    
    <div id="controls">
        <button id="addMessage">Random Message</button>
        <button id="clearAll">Clear All</button>
        <button id="animateBtn">Animate</button>
        <button id="demoMode">Start Demo</button>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { FontLoader } from 'three/addons/loaders/FontLoader.js';
        import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';

        // Create a standalone Three.js application (avoiding XRBlocks compatibility issues)
        class ARChatApp {
            constructor() {
                this.messages = [];
                this.visualElements = [];
                this.isAnimating = true;
                this.clock = new THREE.Clock();
                this.raycaster = new THREE.Raycaster();
                this.mouse = new THREE.Vector2();
                this.demoMode = false;
                this.messageHistory = []; // Store sent messages for history
                this.historyIndex = -1; // Current position in history
                this.demoMessages = [
                    { text: "Welcome to AR Chat!", speaker: "System", color: 0x00ff00 },
                    { text: "How's the weather today?", speaker: "Alice", color: 0x667eea },
                    { text: "It's sunny and perfect for XR!", speaker: "Bob", color: 0x764ba2 },
                    { text: "Let me visualize that for you...", speaker: "AI", color: 0xf093fb },
                    { text: "Amazing spatial communication!", speaker: "User", color: 0xffffff }
                ];
                this.demoIndex = 0;
                
                this.init();
                this.animate();
            }

            init() {
                // Scene setup
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x0a0a0a);
                this.scene.fog = new THREE.Fog(0x0a0a0a, 10, 50);

                // Camera
                this.camera = new THREE.PerspectiveCamera(
                    75,
                    window.innerWidth / window.innerHeight,
                    0.1,
                    1000
                );
                this.camera.position.set(0, 2, 5);

                // Renderer
                this.renderer = new THREE.WebGLRenderer({ antialias: true });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(window.devicePixelRatio);
                document.body.appendChild(this.renderer.domElement);

                // Controls
                this.controls = new OrbitControls(this.camera, this.renderer.domElement);
                this.controls.enableDamping = true;
                this.controls.dampingFactor = 0.05;
                this.controls.target.set(0, 1, 0);
                this.controls.update();

                // Lighting
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
                this.scene.add(ambientLight);

                const directionalLight = new THREE.DirectionalLight(0xffffff, 0.6);
                directionalLight.position.set(5, 10, 5);
                directionalLight.castShadow = true;
                this.scene.add(directionalLight);

                // Create environment
                this.createEnvironment();
                
                // Create caption display area
                this.createCaptionArea();
                
                // Create particle system
                this.createParticles();
                
                // Setup event listeners
                this.setupEventListeners();
                
                // Window resize
                window.addEventListener('resize', () => this.onWindowResize());
                
                // Mouse events for placing messages
                this.renderer.domElement.addEventListener('click', (e) => this.onMouseClick(e));
                this.renderer.domElement.addEventListener('mousemove', (e) => this.onMouseMove(e));
            }

            createEnvironment() {
                // Grid floor
                const gridHelper = new THREE.GridHelper(20, 20, 0x444444, 0x222222);
                this.scene.add(gridHelper);

                // Glass floor
                const floorGeometry = new THREE.PlaneGeometry(20, 20);
                const floorMaterial = new THREE.MeshPhysicalMaterial({
                    color: 0x111111,
                    metalness: 0.8,
                    roughness: 0.2,
                    transparent: true,
                    opacity: 0.5,
                    reflectivity: 1
                });
                const floor = new THREE.Mesh(floorGeometry, floorMaterial);
                floor.rotation.x = -Math.PI / 2;
                floor.position.y = -0.01;
                floor.receiveShadow = true;
                this.scene.add(floor);

                // Ambient spheres
                for (let i = 0; i < 5; i++) {
                    const geometry = new THREE.SphereGeometry(0.1 + Math.random() * 0.2);
                    const material = new THREE.MeshPhysicalMaterial({
                        color: new THREE.Color().setHSL(Math.random(), 0.7, 0.5),
                        metalness: 0.5,
                        roughness: 0.3,
                        emissive: new THREE.Color().setHSL(Math.random(), 0.7, 0.5),
                        emissiveIntensity: 0.2
                    });
                    const sphere = new THREE.Mesh(geometry, material);
                    sphere.position.set(
                        (Math.random() - 0.5) * 10,
                        Math.random() * 3 + 1,
                        (Math.random() - 0.5) * 10
                    );
                    sphere.castShadow = true;
                    this.scene.add(sphere);
                    
                    // Store for animation
                    sphere.userData.floatSpeed = Math.random() * 0.5 + 0.5;
                    sphere.userData.floatOffset = Math.random() * Math.PI * 2;
                    this.visualElements.push(sphere);
                }
            }

            createCaptionArea() {
                // Main caption display container
                this.captionContainer = new THREE.Group();
                this.captionContainer.position.set(0, 2, -2);
                this.scene.add(this.captionContainer);

                // Background panel
                const panelGeometry = new THREE.PlaneGeometry(4, 2);
                const panelMaterial = new THREE.MeshPhysicalMaterial({
                    color: 0x000000,
                    metalness: 0.9,
                    roughness: 0.1,
                    transparent: true,
                    opacity: 0.7,
                    emissive: 0x111133,
                    emissiveIntensity: 0.1
                });
                const panel = new THREE.Mesh(panelGeometry, panelMaterial);
                panel.position.z = -0.1;
                this.captionContainer.add(panel);

                // Panel border
                const borderGeometry = new THREE.EdgesGeometry(panelGeometry);
                const borderMaterial = new THREE.LineBasicMaterial({
                    color: 0x667eea,
                    linewidth: 2
                });
                const border = new THREE.LineSegments(borderGeometry, borderMaterial);
                panel.add(border);
            }

            createParticles() {
                const particleCount = 200;
                const geometry = new THREE.BufferGeometry();
                const positions = new Float32Array(particleCount * 3);
                const colors = new Float32Array(particleCount * 3);

                for (let i = 0; i < particleCount; i++) {
                    positions[i * 3] = (Math.random() - 0.5) * 20;
                    positions[i * 3 + 1] = Math.random() * 10;
                    positions[i * 3 + 2] = (Math.random() - 0.5) * 20;

                    const color = new THREE.Color();
                    color.setHSL(0.6 + Math.random() * 0.3, 1, 0.5);
                    colors[i * 3] = color.r;
                    colors[i * 3 + 1] = color.g;
                    colors[i * 3 + 2] = color.b;
                }

                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

                const material = new THREE.PointsMaterial({
                    size: 0.05,
                    vertexColors: true,
                    transparent: true,
                    opacity: 0.8,
                    blending: THREE.AdditiveBlending
                });

                this.particles = new THREE.Points(geometry, material);
                this.scene.add(this.particles);
            }

            addMessage(text, speaker = "User", position = null) {
                // Create 3D text message
                const messageGroup = new THREE.Group();
                
                // Create sprite for text (more reliable than TextGeometry)
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.width = 512;
                canvas.height = 128;
                
                // Speaker-specific colors
                let gradientColors = ['rgba(102, 126, 234, 0.9)', 'rgba(118, 75, 162, 0.9)'];
                switch(speaker) {
                    case 'You':
                        gradientColors = ['rgba(102, 126, 234, 0.9)', 'rgba(118, 75, 162, 0.9)'];
                        break;
                    case 'Alice':
                        gradientColors = ['rgba(240, 147, 251, 0.9)', 'rgba(245, 87, 108, 0.9)'];
                        break;
                    case 'Bob':
                        gradientColors = ['rgba(88, 193, 238, 0.9)', 'rgba(33, 150, 243, 0.9)'];
                        break;
                    case 'AI':
                    case 'AI Assistant':
                        gradientColors = ['rgba(0, 255, 136, 0.9)', 'rgba(0, 200, 83, 0.9)'];
                        break;
                    case 'System':
                        gradientColors = ['rgba(255, 193, 7, 0.9)', 'rgba(255, 152, 0, 0.9)'];
                        break;
                    default:
                        gradientColors = ['rgba(156, 39, 176, 0.9)', 'rgba(103, 58, 183, 0.9)'];
                }
                
                // Draw background
                const gradient = context.createLinearGradient(0, 0, canvas.width, 0);
                gradient.addColorStop(0, gradientColors[0]);
                gradient.addColorStop(1, gradientColors[1]);
                context.fillStyle = gradient;
                context.roundRect(10, 10, canvas.width - 20, canvas.height - 20, 15);
                context.fill();
                
                // Draw border glow
                context.shadowColor = gradientColors[0];
                context.shadowBlur = 10;
                context.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                context.lineWidth = 2;
                context.roundRect(10, 10, canvas.width - 20, canvas.height - 20, 15);
                context.stroke();
                context.shadowBlur = 0;
                
                // Draw text
                context.fillStyle = '#ffffff';
                context.font = 'bold 24px Arial';
                context.fillText(`${speaker}:`, 30, 45);
                context.font = '20px Arial';
                
                // Word wrap for longer messages
                const maxWidth = canvas.width - 60;
                const words = text.split(' ');
                let line = '';
                let y = 75;
                const lineHeight = 25;
                
                for (let word of words) {
                    const testLine = line + word + ' ';
                    const metrics = context.measureText(testLine);
                    
                    if (metrics.width > maxWidth && line !== '') {
                        context.fillText(line.trim(), 30, y);
                        line = word + ' ';
                        y += lineHeight;
                        if (y > canvas.height - 20) break; // Stop if text goes beyond canvas
                    } else {
                        line = testLine;
                    }
                }
                if (y <= canvas.height - 20) {
                    context.fillText(line.trim(), 30, y);
                }
                
                // Add timestamp
                const now = new Date();
                const timeStr = now.toLocaleTimeString('en-US', { 
                    hour: '2-digit', 
                    minute: '2-digit' 
                });
                context.font = '12px Arial';
                context.fillStyle = 'rgba(255, 255, 255, 0.6)';
                context.fillText(timeStr, canvas.width - 80, canvas.height - 20);
                
                // Create texture and sprite
                const texture = new THREE.CanvasTexture(canvas);
                const spriteMaterial = new THREE.SpriteMaterial({
                    map: texture,
                    transparent: true
                });
                const sprite = new THREE.Sprite(spriteMaterial);
                sprite.scale.set(2, 0.5, 1);
                
                messageGroup.add(sprite);
                
                // Position message
                if (position) {
                    messageGroup.position.copy(position);
                } else {
                    const index = this.messages.length;
                    messageGroup.position.set(
                        -2 + (index % 3) * 2,
                        2.5 - Math.floor(index / 3) * 0.7,
                        -1
                    );
                }
                
                // Add entrance animation
                messageGroup.scale.set(0, 0, 0);
                const targetScale = 1;
                const animateIn = () => {
                    if (messageGroup.scale.x < targetScale) {
                        messageGroup.scale.x += 0.1;
                        messageGroup.scale.y += 0.1;
                        messageGroup.scale.z += 0.1;
                        requestAnimationFrame(animateIn);
                    }
                };
                animateIn();
                
                this.scene.add(messageGroup);
                this.messages.push({
                    group: messageGroup,
                    text: text,
                    speaker: speaker,
                    sprite: sprite,
                    startOpacity: 1,
                    age: 0,
                    timestamp: Date.now()
                });
                
                // Limit messages
                if (this.messages.length > 10) {
                    const oldMessage = this.messages.shift();
                    this.scene.remove(oldMessage.group);
                }
                
                // Add visual effect
                this.createMessageEffect(messageGroup.position);
                
                // Play sound effect (using Web Audio API)
                this.playMessageSound();
            }
            
            playMessageSound() {
                try {
                    // Create a simple beep sound
                    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    const oscillator = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);
                    
                    oscillator.frequency.value = 800;
                    oscillator.type = 'sine';
                    
                    gainNode.gain.setValueAtTime(0, audioContext.currentTime);
                    gainNode.gain.linearRampToValueAtTime(0.1, audioContext.currentTime + 0.01);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.2);
                    
                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + 0.2);
                } catch (e) {
                    // Silently fail if audio is not supported
                    console.log('Audio not available');
                }
            }

            createMessageEffect(position) {
                // Create expanding ring effect
                const geometry = new THREE.RingGeometry(0.1, 0.3, 32);
                const material = new THREE.MeshBasicMaterial({
                    color: 0x667eea,
                    transparent: true,
                    opacity: 1,
                    side: THREE.DoubleSide
                });
                const ring = new THREE.Mesh(geometry, material);
                ring.position.copy(position);
                ring.lookAt(this.camera.position);
                this.scene.add(ring);
                
                // Store for animation
                ring.userData.isEffect = true;
                ring.userData.age = 0;
                ring.userData.maxAge = 1;
                this.visualElements.push(ring);
            }

            clearMessages() {
                this.messages.forEach(msg => {
                    this.scene.remove(msg.group);
                });
                this.messages = [];
            }

            startDemo() {
                this.demoMode = true;
                this.demoIndex = 0;
                this.runDemoSequence();
            }

            runDemoSequence() {
                if (!this.demoMode) return;
                
                if (this.demoIndex < this.demoMessages.length) {
                    const msg = this.demoMessages[this.demoIndex];
                    this.addMessage(msg.text, msg.speaker);
                    this.demoIndex++;
                    setTimeout(() => this.runDemoSequence(), 2000);
                } else {
                    // Loop demo
                    setTimeout(() => {
                        this.clearMessages();
                        this.demoIndex = 0;
                        this.runDemoSequence();
                    }, 3000);
                }
            }

            setupEventListeners() {
                // Keyboard input handling
                const messageInput = document.getElementById('messageInput');
                const speakerSelect = document.getElementById('speakerSelect');
                const sendBtn = document.getElementById('sendBtn');
                
                // Send message function
                const sendMessage = () => {
                    const text = messageInput.value.trim();
                    const speaker = speakerSelect.value;
                    
                    if (text) {
                        this.addMessage(text, speaker);
                        
                        // Add to history if it's from "You"
                        if (speaker === 'You') {
                            this.messageHistory.push(text);
                            this.historyIndex = this.messageHistory.length;
                        }
                        
                        messageInput.value = '';
                        messageInput.focus(); // Keep focus on input
                        
                        // Visual feedback on send button
                        sendBtn.style.transform = 'scale(0.95)';
                        setTimeout(() => {
                            sendBtn.style.transform = 'scale(1)';
                        }, 100);
                        
                        // Auto-response in demo mode
                        if (this.demoMode && speaker === 'You') {
                            setTimeout(() => {
                                const responses = [
                                    "That's interesting! Tell me more.",
                                    "I see what you mean.",
                                    "Great point!",
                                    "Let me visualize that for you...",
                                    "Fascinating perspective!"
                                ];
                                const response = responses[Math.floor(Math.random() * responses.length)];
                                this.addMessage(response, 'AI');
                            }, 1500);
                        }
                    }
                };
                
                // Send on Enter key
                messageInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        sendMessage();
                    }
                });
                
                // Navigate message history with arrow keys
                messageInput.addEventListener('keydown', (e) => {
                    if (e.key === 'ArrowUp') {
                        e.preventDefault();
                        if (this.historyIndex > 0) {
                            this.historyIndex--;
                            messageInput.value = this.messageHistory[this.historyIndex];
                        }
                    } else if (e.key === 'ArrowDown') {
                        e.preventDefault();
                        if (this.historyIndex < this.messageHistory.length - 1) {
                            this.historyIndex++;
                            messageInput.value = this.messageHistory[this.historyIndex];
                        } else {
                            this.historyIndex = this.messageHistory.length;
                            messageInput.value = '';
                        }
                    }
                });
                
                // Send on button click
                sendBtn.addEventListener('click', sendMessage);
                
                // Quick speaker change with keyboard shortcuts
                document.addEventListener('keydown', (e) => {
                    // Alt + 1-5 to change speaker
                    if (e.altKey) {
                        switch(e.key) {
                            case '1':
                                speakerSelect.value = 'You';
                                break;
                            case '2':
                                speakerSelect.value = 'Alice';
                                break;
                            case '3':
                                speakerSelect.value = 'Bob';
                                break;
                            case '4':
                                speakerSelect.value = 'AI';
                                break;
                            case '5':
                                speakerSelect.value = 'System';
                                break;
                        }
                    }
                    
                    // Ctrl + L to clear all
                    if (e.ctrlKey && e.key === 'l') {
                        e.preventDefault();
                        this.clearMessages();
                    }
                    
                    // Ctrl + D for demo mode
                    if (e.ctrlKey && e.key === 'd') {
                        e.preventDefault();
                        this.startDemo();
                    }
                });
                
                // Random message button
                document.getElementById('addMessage').addEventListener('click', () => {
                    const messages = [
                        "Hello XR World!",
                        "This is spatial communication",
                        "Augmented conversations",
                        "Visual captions in 3D",
                        "Future of communication"
                    ];
                    const speakers = ["User", "Alice", "Bob", "System", "AI"];
                    const randomMsg = messages[Math.floor(Math.random() * messages.length)];
                    const randomSpeaker = speakers[Math.floor(Math.random() * speakers.length)];
                    this.addMessage(randomMsg, randomSpeaker);
                });

                document.getElementById('clearAll').addEventListener('click', () => {
                    this.clearMessages();
                    this.demoMode = false;
                    messageInput.focus();
                });

                document.getElementById('animateBtn').addEventListener('click', (e) => {
                    this.isAnimating = !this.isAnimating;
                    e.target.classList.toggle('active');
                });

                document.getElementById('demoMode').addEventListener('click', (e) => {
                    this.startDemo();
                    e.target.classList.add('active');
                });
                
                // Focus input on load
                messageInput.focus();
            }

            onMouseMove(event) {
                this.mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                this.mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            }

            onMouseClick(event) {
                // Cast ray to find intersection point
                this.raycaster.setFromCamera(this.mouse, this.camera);
                
                // Create a plane at y=1 for intersection
                const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -1);
                const intersectPoint = new THREE.Vector3();
                this.raycaster.ray.intersectPlane(plane, intersectPoint);
                
                if (intersectPoint) {
                    this.addMessage("Spatial marker!", "Click", intersectPoint);
                    
                    // Visual feedback
                    const geometry = new THREE.SphereGeometry(0.1);
                    const material = new THREE.MeshPhysicalMaterial({
                        color: 0x00ff88,
                        emissive: 0x00ff88,
                        emissiveIntensity: 0.5,
                        metalness: 0.8,
                        roughness: 0.2
                    });
                    const marker = new THREE.Mesh(geometry, material);
                    marker.position.copy(intersectPoint);
                    this.scene.add(marker);
                    
                    // Remove after a delay
                    setTimeout(() => {
                        this.scene.remove(marker);
                    }, 3000);
                }
            }

            onWindowResize() {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
            }

            animate() {
                requestAnimationFrame(() => this.animate());
                
                const delta = this.clock.getDelta();
                const time = this.clock.getElapsedTime();
                
                if (this.isAnimating) {
                    // Animate particles
                    if (this.particles) {
                        this.particles.rotation.y += delta * 0.05;
                        const positions = this.particles.geometry.attributes.position.array;
                        for (let i = 0; i < positions.length; i += 3) {
                            positions[i + 1] += Math.sin(time + i) * 0.001;
                        }
                        this.particles.geometry.attributes.position.needsUpdate = true;
                    }
                    
                    // Animate visual elements
                    this.visualElements.forEach((element, index) => {
                        if (element.userData.isEffect) {
                            // Animate effects
                            element.userData.age += delta;
                            const progress = element.userData.age / element.userData.maxAge;
                            element.scale.set(1 + progress * 2, 1 + progress * 2, 1);
                            element.material.opacity = 1 - progress;
                            
                            if (progress >= 1) {
                                this.scene.remove(element);
                                this.visualElements.splice(index, 1);
                            }
                        } else if (element.userData.floatSpeed) {
                            // Float animation
                            element.position.y += Math.sin(time * element.userData.floatSpeed + element.userData.floatOffset) * 0.002;
                            element.rotation.x += delta * 0.5;
                            element.rotation.y += delta * 0.3;
                        }
                    });
                    
                    // Animate messages
                    this.messages.forEach((msg, index) => {
                        msg.age += delta;
                        // Gentle floating
                        msg.group.position.y += Math.sin(time * 2 + index) * 0.0005;
                        // Fade old messages
                        if (msg.age > 5) {
                            msg.sprite.material.opacity = Math.max(0.3, 1 - (msg.age - 5) * 0.1);
                        }
                    });
                }
                
                this.controls.update();
                this.renderer.render(this.scene, this.camera);
            }
        }

        // Initialize the application when page loads
        window.addEventListener('DOMContentLoaded', () => {
            const app = new ARChatApp();
        });
    </script>
</body>
</html>

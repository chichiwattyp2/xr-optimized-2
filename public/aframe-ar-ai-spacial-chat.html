<!DOCTYPE html>
<html>
<head>
    <title>A-Frame AR Chat - Visual Communication in XR</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/supermedium/superframe@master/components/environment/dist/aframe-environment-component.min.js"></script>
    <!--script src="https://cdn.jsdelivr.net/npm/aframe-particle-system-component@1.1.3/dist/aframe-particle-system-component.min.js"></script -->
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            overflow: hidden;
        }
        
        #ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 999;
            pointer-events: none;
        }
        
        #info {
            text-align: center;
            color: white;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.9), rgba(118, 75, 162, 0.9));
            padding: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            pointer-events: auto;
        }
        
        #info h2 {
            margin: 0 0 5px 0;
            font-size: 1.8em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        #info p {
            margin: 0;
            font-size: 0.9em;
            opacity: 0.95;
        }
        
        #chat-controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 600px;
            width: 90%;
        }
        
        #input-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        #speakerSelect {
            padding: 12px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 2px solid rgba(102, 126, 234, 0.5);
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 140px;
        }
        
        #speakerSelect:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(102, 126, 234, 0.8);
        }
        
        #speakerSelect option {
            background: #1a1a2e;
            color: white;
        }
        
        #messageInput {
            flex: 1;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 2px solid rgba(102, 126, 234, 0.5);
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        #messageInput::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        
        #messageInput:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(102, 126, 234, 1);
            box-shadow: 0 0 15px rgba(102, 126, 234, 0.3);
        }
        
        #sendBtn {
            padding: 12px 25px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 2px 10px rgba(102, 126, 234, 0.3);
        }
        
        #sendBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.5);
        }
        
        #sendBtn:active {
            transform: scale(0.95);
        }
        
        #button-row {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        
        .control-btn {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .control-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(102, 126, 234, 0.6);
        }
        
        .control-btn.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-color: transparent;
        }
        
        #vr-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1001;
        }
        
        .a-enter-vr-button {
            background: linear-gradient(135deg, #00ff88, #00cc66) !important;
            border: none !important;
            box-shadow: 0 4px 20px rgba(0, 255, 136, 0.4) !important;
        }
        
        @media (max-width: 600px) {
            #chat-controls {
                bottom: 10px;
                padding: 10px;
                width: 95%;
            }
            
            #speakerSelect {
                min-width: 100px;
                font-size: 12px;
            }
            
            #messageInput {
                font-size: 12px;
            }
            
            .control-btn {
                font-size: 11px;
                padding: 6px 10px;
            }
        }
    </style>
</head>
<body>
    <div id="ui-overlay">
        <div id="info">
            <h2>🎭 A-Frame AR Chat</h2>
            <p>Look & click to place messages • Keyboard: Enter to send • ↑↓ history • Alt+1-5 speaker • VR/AR ready!</p>
        </div>
    </div>

    <div id="chat-controls">
        <div id="input-row">
            <select id="speakerSelect">
                <option value="You">👤 You</option>
                <option value="Alice">👩 Alice</option>
                <option value="Bob">👨 Bob</option>
                <option value="AI">🤖 AI</option>
                <option value="System">⚙️ System</option>
            </select>
            <input type="text" id="messageInput" placeholder="Type your message..." maxlength="200" autofocus>
            <button id="sendBtn">Send 📤</button>
        </div>
        <div id="button-row">
            <button class="control-btn" id="demoBtn">🎬 Demo</button>
            <button class="control-btn" id="clearBtn">🗑️ Clear</button>
            <button class="control-btn" id="arBtn">📱 AR Mode</button>
            <button class="control-btn active" id="particleBtn">✨ Particles</button>
            <button class="control-btn active" id="soundBtn">🔊 Sound</button>
        </div>
    </div>

    <!-- A-Frame Scene -->
    <a-scene
        stats
        background="color: #0a0a0a"
        fog="type: exponential; color: #0a0a0a; density: 0.05"
        webxr="optionalFeatures: hand-tracking, hit-test, dom-overlay; 
               overlayElement: #ui-overlay;
               referenceSpaceType: local"
        cursor="rayOrigin: mouse"
        raycaster="objects: .clickable"
        vr-mode-ui="enabled: true; enterVRButton: #vr-button">
        
        <!-- Assets -->
        <a-assets>
            <!-- Message templates -->
            <a-mixin id="message-animation"
                animation__scale="property: scale; from: 0 0 0; to: 1 1 1; dur: 500; easing: easeOutElastic"
                animation__fade="property: opacity; from: 0; to: 1; dur: 300">
            </a-mixin>
            
            <!-- Sounds -->
            <audio id="message-sound" src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmwhBTGH0fPTgjMGHm7A7+OZURE"/>
        </a-assets>

        <!-- Camera with cursor -->
        <a-entity id="camera-rig" position="0 1.6 0">
            <a-camera 
                look-controls
                wasd-controls="acceleration: 20">
                <a-cursor 
                    position="0 0 -1"
                    geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.016"
                    material="color: #667eea; shader: flat"
                    animation__click="property: scale; startEvents: click; from: 0.1 0.1 0.1; to: 1 1 1; dur: 150"
                    animation__fusing="property: scale; startEvents: fusing; from: 1 1 1; to: 0.1 0.1 0.1; dur: 1500"
                    raycaster="objects: .clickable">
                </a-cursor>
                <!-- HUD display for VR -->
                <a-text 
                    value="AR Chat Active" 
                    position="0 0.3 -0.5" 
                    align="center" 
                    color="#667eea"
                    scale="0.1 0.1 0.1"
                    visible="false"
                    id="hud-text">
                </a-text>
            </a-camera>
            
            <!-- Hand controllers for VR -->
            <a-entity laser-controls="hand: right" raycaster="objects: .clickable"></a-entity>
            <a-entity laser-controls="hand: left" raycaster="objects: .clickable"></a-entity>
        </a-entity>

        <!-- Environment -->
        <a-entity environment="preset: starry; 
                               groundColor: #1a1a2e; 
                               skyType: atmosphere; 
                               skyColor: #000033;
                               fog: 0.8;
                               flatShading: false;
                               playArea: 1;
                               ground: hills;
                               groundYScale: 10;
                               groundTexture: squares;
                               groundColor2: #0f0f1e;
                               gridColor: #667eea">
        </a-entity>

        <!-- Particle system -->
        <a-entity 
            id="particles"
            particle-system="
                preset: dust;
                particleCount: 200;
                color: #667eea,#764ba2,#f093fb;
                size: 0.3;
                velocityValue: 0 0.1 0;
                velocitySpread: 0.5 0 0.5;
                accelerationValue: 0 -0.001 0;
                opacity: 0.4;
                blending: 1">
        </a-entity>

        <!-- Ambient lighting -->
        <a-light type="ambient" color="#ffffff" intensity="0.4"></a-light>
        <a-light type="directional" position="1 2 1" color="#ffffff" intensity="0.6"></a-light>
        <a-light type="point" position="0 3 0" color="#667eea" intensity="0.3" distance="10"></a-light>

        <!-- Message display area -->
        <a-entity id="message-container" position="0 2 -3">
            <!-- Background panel -->
            <a-plane 
                width="4" 
                height="2.5" 
                color="#000000" 
                opacity="0.7"
                material="shader: flat; transparent: true">
                <a-box 
                    width="4.05" 
                    height="2.55" 
                    depth="0.01"
                    position="0 0 -0.01"
                    material="color: #667eea; shader: flat; opacity: 0.5; transparent: true">
                </a-box>
            </a-plane>
            <a-text 
                value="Messages will appear here" 
                align="center" 
                position="0 0.8 0.01"
                color="#667eea"
                opacity="0.5">
            </a-text>
        </a-entity>

        <!-- Floating UI elements -->
        <a-entity id="floating-elements" position="3 2 -3">
            <!-- Status orb -->
            <a-sphere 
                id="status-orb"
                radius="0.1" 
                color="#00ff88"
                material="emissive: #00ff88; emissiveIntensity: 0.5; shader: standard"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 4000"
                animation__pulse="property: scale; from: 1 1 1; to: 1.2 1.2 1.2; dir: alternate; loop: true; dur: 1000">
            </a-sphere>
            <a-text value="Online" align="center" position="0 -0.2 0" scale="0.3 0.3 0.3" color="#00ff88"></a-text>
        </a-entity>

        <!-- Clickable floor plane for message placement -->
        <a-plane 
            id="floor"
            class="clickable"
            width="30" 
            height="30" 
            rotation="-90 0 0" 
            position="0 0 0"
            material="color: #0a0a0f; opacity: 0.3; transparent: true"
            visible="false">
        </a-plane>

        <!-- Visual effects container -->
        <a-entity id="effects-container"></a-entity>
    </a-scene>

    <!-- VR button container -->
    <div id="vr-button"></div>

    <script>
        // AFRAME Component for message display
        AFRAME.registerComponent('message-bubble', {
            schema: {
                text: {type: 'string', default: 'Hello AR!'},
                speaker: {type: 'string', default: 'User'},
                color: {type: 'color', default: '#667eea'}
            },
            
            init: function() {
                const data = this.data;
                const el = this.el;
                
                // Create message structure
                const bubble = document.createElement('a-entity');
                
                // Background plane
                const bg = document.createElement('a-plane');
                bg.setAttribute('width', 3);
                bg.setAttribute('height', 0.6);
                bg.setAttribute('material', {
                    color: data.color,
                    opacity: 0.9,
                    shader: 'flat',
                    transparent: true
                });
                
                // Speaker text
                const speakerText = document.createElement('a-text');
                speakerText.setAttribute('value', data.speaker + ':');
                speakerText.setAttribute('position', '-1.3 0.1 0.01');
                speakerText.setAttribute('color', '#ffffff');
                speakerText.setAttribute('font', 'kelsonsans');
                speakerText.setAttribute('width', 4);
                
                // Message text
                const messageText = document.createElement('a-text');
                messageText.setAttribute('value', data.text);
                messageText.setAttribute('position', '-1.3 -0.1 0.01');
                messageText.setAttribute('color', '#ffffff');
                messageText.setAttribute('font', 'dejavu');
                messageText.setAttribute('width', 3.5);
                messageText.setAttribute('wrap-count', 40);
                
                // Timestamp
                const time = new Date().toLocaleTimeString('en-US', {
                    hour: '2-digit',
                    minute: '2-digit'
                });
                const timeText = document.createElement('a-text');
                timeText.setAttribute('value', time);
                timeText.setAttribute('position', '1.2 -0.2 0.01');
                timeText.setAttribute('color', '#aaaaaa');
                timeText.setAttribute('width', 2);
                timeText.setAttribute('align', 'right');
                
                bubble.appendChild(bg);
                bubble.appendChild(speakerText);
                bubble.appendChild(messageText);
                bubble.appendChild(timeText);
                el.appendChild(bubble);
                
                // Play sound
                const sound = document.querySelector('#message-sound');
                if (sound && window.soundEnabled) {
                    sound.play().catch(e => console.log('Audio play failed'));
                }
            }
        });

        // Chat Application Controller
        class ARChatController {
            constructor() {
                this.messages = [];
                this.messageHistory = [];
                this.historyIndex = -1;
                this.demoMode = false;
                this.soundEnabled = true;
                this.particlesEnabled = true;
                this.messageCount = 0;
                this.maxMessages = 10;
                
                this.speakerColors = {
                    'You': '#667eea',
                    'Alice': '#f093fb',
                    'Bob': '#58c1ee',
                    'AI': '#00ff88',
                    'System': '#ffc107'
                };
                
                this.demoMessages = [
                    { text: "Welcome to A-Frame AR Chat!", speaker: "System" },
                    { text: "This is a spatial messaging system", speaker: "AI" },
                    { text: "You can place messages in 3D space!", speaker: "Alice" },
                    { text: "Try looking around and clicking", speaker: "Bob" },
                    { text: "Or type your own messages below", speaker: "System" },
                    { text: "VR and AR modes are fully supported!", speaker: "AI" }
                ];
                
                this.init();
            }
            
            init() {
                // Get elements
                this.scene = document.querySelector('a-scene');
                this.messageContainer = document.querySelector('#message-container');
                this.effectsContainer = document.querySelector('#effects-container');
                this.messageInput = document.querySelector('#messageInput');
                this.speakerSelect = document.querySelector('#speakerSelect');
                this.sendBtn = document.querySelector('#sendBtn');
                
                // Setup event listeners
                this.setupEventListeners();
                
                // Setup scene click handler
                this.setupSceneInteraction();
                
                // Set global sound state
                window.soundEnabled = this.soundEnabled;
            }
            
            setupEventListeners() {
                // Send message
                const sendMessage = () => {
                    const text = this.messageInput.value.trim();
                    const speaker = this.speakerSelect.value;
                    
                    if (text) {
                        this.addMessage(text, speaker);
                        
                        if (speaker === 'You') {
                            this.messageHistory.push(text);
                            this.historyIndex = this.messageHistory.length;
                        }
                        
                        this.messageInput.value = '';
                        this.messageInput.focus();
                        
                        // Auto-response in demo mode
                        if (this.demoMode && speaker === 'You') {
                            setTimeout(() => {
                                const responses = [
                                    "That's fascinating! Tell me more.",
                                    "I see what you mean.",
                                    "Great observation!",
                                    "Let me process that...",
                                    "Interesting perspective!"
                                ];
                                const response = responses[Math.floor(Math.random() * responses.length)];
                                this.addMessage(response, 'AI');
                            }, 1500);
                        }
                    }
                };
                
                // Keyboard events
                this.messageInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        sendMessage();
                    }
                });
                
                this.messageInput.addEventListener('keydown', (e) => {
                    if (e.key === 'ArrowUp') {
                        e.preventDefault();
                        if (this.historyIndex > 0) {
                            this.historyIndex--;
                            this.messageInput.value = this.messageHistory[this.historyIndex];
                        }
                    } else if (e.key === 'ArrowDown') {
                        e.preventDefault();
                        if (this.historyIndex < this.messageHistory.length - 1) {
                            this.historyIndex++;
                            this.messageInput.value = this.messageHistory[this.historyIndex];
                        } else {
                            this.historyIndex = this.messageHistory.length;
                            this.messageInput.value = '';
                        }
                    }
                });
                
                // Alt + number to change speaker
                document.addEventListener('keydown', (e) => {
                    if (e.altKey) {
                        switch(e.key) {
                            case '1': this.speakerSelect.value = 'You'; break;
                            case '2': this.speakerSelect.value = 'Alice'; break;
                            case '3': this.speakerSelect.value = 'Bob'; break;
                            case '4': this.speakerSelect.value = 'AI'; break;
                            case '5': this.speakerSelect.value = 'System'; break;
                        }
                    }
                });
                
                this.sendBtn.addEventListener('click', sendMessage);
                
                // Control buttons
                document.querySelector('#demoBtn').addEventListener('click', (e) => {
                    this.toggleDemo();
                    e.target.classList.toggle('active');
                });
                
                document.querySelector('#clearBtn').addEventListener('click', () => {
                    this.clearMessages();
                });
                
                document.querySelector('#arBtn').addEventListener('click', (e) => {
                    this.toggleARMode();
                    e.target.classList.toggle('active');
                });
                
                document.querySelector('#particleBtn').addEventListener('click', (e) => {
                    this.toggleParticles();
                    e.target.classList.toggle('active');
                });
                
                document.querySelector('#soundBtn').addEventListener('click', (e) => {
                    this.soundEnabled = !this.soundEnabled;
                    window.soundEnabled = this.soundEnabled;
                    e.target.classList.toggle('active');
                });
            }
            
            setupSceneInteraction() {
                // Click on floor to place messages
                const floor = document.querySelector('#floor');
                floor.addEventListener('click', (e) => {
                    const point = e.detail.intersection.point;
                    this.addMessage('Spatial marker!', 'Click', point);
                    this.createClickEffect(point);
                });
                
                // Make floor visible for interaction
                floor.setAttribute('visible', true);
            }
            
            addMessage(text, speaker = 'User', position = null) {
                const messageEntity = document.createElement('a-entity');
                const color = this.speakerColors[speaker] || '#667eea';
                
                messageEntity.setAttribute('message-bubble', {
                    text: text,
                    speaker: speaker,
                    color: color
                });
                
                if (position) {
                    // Place at clicked position
                    messageEntity.setAttribute('position', {
                        x: position.x,
                        y: position.y + 1,
                        z: position.z
                    });
                    messageEntity.setAttribute('look-at', '[camera]');
                    this.scene.appendChild(messageEntity);
                } else {
                    // Add to message container
                    const index = this.messages.length;
                    const row = Math.floor(index / 1);
                    const yOffset = row * -0.7;
                    
                    messageEntity.setAttribute('position', {
                        x: 0,
                        y: yOffset + 0.5,
                        z: 0.01
                    });
                    
                    this.messageContainer.appendChild(messageEntity);
                    this.messages.push(messageEntity);
                    
                    // Remove old messages
                    if (this.messages.length > this.maxMessages) {
                        const oldMessage = this.messages.shift();
                        oldMessage.parentNode.removeChild(oldMessage);
                        
                        // Reposition remaining messages
                        this.messages.forEach((msg, i) => {
                            const newRow = Math.floor(i / 1);
                            const newY = newRow * -0.7 + 0.5;
                            msg.setAttribute('animation', {
                                property: 'position',
                                to: `0 ${newY} 0.01`,
                                dur: 300
                            });
                        });
                    }
                }
                
                // Add animations
                messageEntity.setAttribute('animation__scale', {
                    property: 'scale',
                    from: '0 0 0',
                    to: '1 1 1',
                    dur: 500,
                    easing: 'easeOutElastic'
                });
                
                this.createMessageEffect(position || {
                    x: 0,
                    y: 2,
                    z: -3
                });
            }
            
            createMessageEffect(position) {
                const effect = document.createElement('a-ring');
                effect.setAttribute('radius-inner', 0.1);
                effect.setAttribute('radius-outer', 0.3);
                effect.setAttribute('color', '#667eea');
                effect.setAttribute('opacity', 0.8);
                effect.setAttribute('position', position);
                effect.setAttribute('rotation', '-90 0 0');
                
                effect.setAttribute('animation__scale', {
                    property: 'scale',
                    from: '0.1 0.1 0.1',
                    to: '2 2 2',
                    dur: 1000
                });
                
                effect.setAttribute('animation__fade', {
                    property: 'opacity',
                    from: 0.8,
                    to: 0,
                    dur: 1000
                });
                
                this.effectsContainer.appendChild(effect);
                
                setTimeout(() => {
                    effect.parentNode.removeChild(effect);
                }, 1000);
            }
            
            createClickEffect(position) {
                // Create expanding sphere effect
                const sphere = document.createElement('a-sphere');
                sphere.setAttribute('radius', 0.1);
                sphere.setAttribute('color', '#00ff88');
                sphere.setAttribute('material', 'opacity: 0.6; transparent: true');
                sphere.setAttribute('position', position);
                
                sphere.setAttribute('animation__grow', {
                    property: 'radius',
                    from: 0.1,
                    to: 0.5,
                    dur: 500
                });
                
                sphere.setAttribute('animation__fade', {
                    property: 'material.opacity',
                    from: 0.6,
                    to: 0,
                    dur: 500
                });
                
                this.scene.appendChild(sphere);
                
                setTimeout(() => {
                    sphere.parentNode.removeChild(sphere);
                }, 500);
            }
            
            clearMessages() {
                this.messages.forEach(msg => {
                    msg.parentNode.removeChild(msg);
                });
                this.messages = [];
                
                // Clear spatial messages
                const spatialMessages = this.scene.querySelectorAll('[message-bubble]');
                spatialMessages.forEach(msg => {
                    if (!this.messages.includes(msg)) {
                        msg.parentNode.removeChild(msg);
                    }
                });
                
                this.addMessage('Chat cleared', 'System');
            }
            
            toggleDemo() {
                this.demoMode = !this.demoMode;
                if (this.demoMode) {
                    this.runDemo();
                }
            }
            
            runDemo(index = 0) {
                if (!this.demoMode || index >= this.demoMessages.length) {
                    if (this.demoMode) {
                        // Loop demo
                        setTimeout(() => this.runDemo(0), 3000);
                    }
                    return;
                }
                
                const msg = this.demoMessages[index];
                this.addMessage(msg.text, msg.speaker);
                
                setTimeout(() => this.runDemo(index + 1), 2000);
            }
            
            toggleARMode() {
                const scene = document.querySelector('a-scene');
                if (scene.is('ar-mode')) {
                    scene.exitAR();
                } else if (AFRAME.utils.device.checkARSupport()) {
                    scene.enterAR();
                }
            }
            
            toggleParticles() {
                this.particlesEnabled = !this.particlesEnabled;
                const particles = document.querySelector('#particles');
                particles.setAttribute('visible', this.particlesEnabled);
            }
        }
        
        // Initialize when scene is loaded
        document.querySelector('a-scene').addEventListener('loaded', () => {
            const chatApp = new ARChatController();
            
            // Show welcome message
            setTimeout(() => {
                chatApp.addMessage('Welcome! Start typing or click in the scene', 'System');
            }, 1000);
        });
        
        // Handle VR mode changes
        document.querySelector('a-scene').addEventListener('enter-vr', () => {
            document.querySelector('#chat-controls').style.display = 'none';
            document.querySelector('#hud-text').setAttribute('visible', true);
        });
        
        document.querySelector('a-scene').addEventListener('exit-vr', () => {
            document.querySelector('#chat-controls').style.display = 'flex';
            document.querySelector('#hud-text').setAttribute('visible', false);
        });
    </script>
</body>
</html>
